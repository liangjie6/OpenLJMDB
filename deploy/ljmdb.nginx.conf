# External same-origin check happens before translating the loopback API headers.
map $http_origin $ljmdb_effective_origin {
    default $http_origin;
    "" "$scheme://$http_host";
}
map $http_origin $ljmdb_backend_origin {
    default "http://127.0.0.1:19955";
    "" "";
}

server {
    listen 9955 default_server;
    listen [::]:9955 default_server;
    server_name _;
    root /var/www/openljmdb/current;
    include /etc/nginx/snippets/shared-404.conf;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/ljmdb.access.log;
    error_log /var/log/nginx/ljmdb.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    set $ljmdb_public_origin "$scheme://$http_host";

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        if ($ljmdb_effective_origin != $ljmdb_public_origin) {
            return 403;
        }
        # Backend enforces per-endpoint upload limits, including large backups.
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:19955;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:19955;
        proxy_set_header Origin $ljmdb_backend_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /index.html {
        expires -1;
    }
    location ~ \.map$ {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location /vendor/ {
        try_files $uri =404;
        expires 1h;
    }
    location /fonts/ {
        try_files $uri =404;
        types {
            font/woff2 woff2;
            text/plain txt md;
        }
    }
    include /etc/nginx/snippets/shared-404-ljmdb-routes.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
